# /etc/nginx/sites-available/painel-vps
#
# Serve o front (build estático do dashboard) e faz proxy das chamadas
# de API para o agente que roda em 127.0.0.1:4100.

server {
    listen 80;
    server_name painel.seudominio.com.br;

    # Redireciona tudo para HTTPS depois que o certbot configurar o certificado
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name painel.seudominio.com.br;

    # Certbot substitui essas duas linhas automaticamente
    ssl_certificate     /etc/letsencrypt/live/painel.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.seudominio.com.br/privkey.pem;

    # Front-end: build estático do Vite (npm run build -> pasta dist/)
    root /var/www/painel-vps/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o agente de métricas — único lugar que conhece o token
    location /api/vps-agent/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_set_header Authorization "Bearer SEU_TOKEN_AQUI";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Bloqueia acesso direto à porta do agente vindo de fora, por segurança extra
    # (o agente já escuta só em 127.0.0.1, isso aqui é defesa em profundidade)
}
